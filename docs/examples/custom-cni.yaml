#cloud-config
#
# Replacing the default CNI.
#
# Corium ships kube-router by default because that is what k0s defaults to: one
# component covering networking, network policy and service proxying. Setting
# `cni: custom` makes k0s deploy no CNI at all, leaving the choice entirely to
# you.
#
# Be aware of what that means: with no CNI installed, the node stays NotReady
# and pods that need cluster networking stay Pending. That is expected, not
# broken -- the cluster is waiting for you. The add-on below fills the gap in
# the same document, so the node converges on its own.
#
# The full walkthrough, including the kube-proxy-free variant, is in
# docs/cilium.md.

corium:
  role: single

  cluster:
    name: lab

  network:
    podCIDR: 10.244.0.0/16
    serviceCIDR: 10.96.0.0/12
    # k0s installs nothing; the add-on below provides networking.
    cni: custom

  addons:
    - name: cilium
      chart: cilium/cilium
      version: 1.20.2
      namespace: kube-system
      repository:
        name: cilium
        url: https://helm.cilium.io/
      values:
        # Must agree with network.podCIDR above. Corium does not reconcile
        # add-on values against the rest of the configuration -- they are
        # passed to the chart untouched, by design.
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList:
              - 10.244.0.0/16

        # Cilium can replace kube-proxy entirely. Doing so also means
        # disabling k0s's own kube-proxy through k0s.patch, and giving Cilium
        # an API server address it can reach without a cluster network -- see
        # docs/cilium.md.
        kubeProxyReplacement: false

users:
  - name: core
    groups: [wheel]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAREPLACEME you@example.com
