#cloud-config
#
# A worker that can be managed with cctl, showing the two ways an operator CA
# reaches a node and the third way, which puts nothing in this document at all.
#
# The API is off unless one of these is present. A node with no `api:` block
# runs no daemon and binds no port.

corium:
  role: worker

  join:
    tokenFrom:
      url: https://secrets.example.com/corium/worker-token

  api:
    # Mode A. The CA *certificate* -- never its key. A certificate is public
    # material, so unlike the join token above it is safe here in clear:
    # anything that can read this document learns nothing it can act on.
    #
    # Every node in the fleet carries the same block.
    operatorCA: |
      -----BEGIN CERTIFICATE-----
      REPLACEME -- output of: openssl x509 -in operator-ca.pem
      -----END CERTIFICATE-----

    # Mode B. The same thing, resolved at first boot, for a CA minted by the
    # run that builds the cluster. Set one or the other, not both.
    #
    # operatorCAFrom:
    #   url: https://pki.example.com/corium/operator-ca.pem
    #   waitFor: 15m

    # Mode C, maintenance mode: `enabled: true` and neither key above. The node
    # validates its configuration and then stops before bootstrapping k0s,
    # printing a pairing code and its certificate fingerprint on the console:
    #
    #   cctl enroll 192.168.1.51 --code K7QM-93XF
    #
    # Enrolment pins the CA and releases the bootstrap. Nothing about the
    # node's identity is in this document, at the cost of one console visit per
    # machine -- a node waiting to be claimed is in no cluster.
    #
    # enabled: true

    # And the fourth position, which is the default: no API at all. Written
    # explicitly it also masks the unit, so nothing re-enables it later.
    #
    # enabled: false

users:
  - name: core
    groups: [wheel]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAREPLACEME operator@example.com
