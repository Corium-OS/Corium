# Corium — SSH access managed by the management API.
#
# corium-apid (see docs/adr/0005-ssh-access-over-the-api.md) trusts keys for a
# user that already exists by writing them to a file of its own,
# /var/lib/corium/ssh/<user>: root-owned, and separate from the user's own
# ~/.ssh/authorized_keys so the two authorities never edit one file. Naming both
# here is what makes sshd read Corium's file as well as the user's. This drop-in
# is 10- so it is read before the distribution's, and sshd takes the first
# AuthorizedKeysFile it sees.
AuthorizedKeysFile	.ssh/authorized_keys	/var/lib/corium/ssh/%u

# Corium creates no root account and cloud-init disables the one the image ships
# with. Refusing root over SSH outright makes that a property of the daemon too,
# and not only of the account's state.
PermitRootLogin	no
