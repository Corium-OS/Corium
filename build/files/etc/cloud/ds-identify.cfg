# Let cloud-init run when ds-identify finds nothing.
#
# ds-identify runs as a systemd generator, which is before any mount unit has
# run. On an ostree system /var is the stateroot's, mounted later, so a seed
# written to /var/lib/cloud/seed/nocloud -- the documented way to configure a
# dedicated server from a rescue system -- is invisible at the moment the
# question is asked. ds-identify returns notfound, and the default policy
# (search,found=all,maybe=none,notfound=disabled) turns that into "disable
# cloud-init for this boot".
#
# Nothing then starts: not cloud-init, and not corium-bootstrap.service or
# corium-apid.service either, because both are WantedBy=cloud-init.target and
# that target is only enabled by cloud-init's generator. The node boots healthy
# and completely inert -- no account, because cloud.cfg sets `users: []`, and no
# API, so there is no way in and nothing on the console but a login prompt.
# Found on an OVH dedicated server installed by hand from rescue mode.
#
# notfound=enabled lets cloud-init start anyway. cloud-init-local.service then
# runs its own datasource search with /var mounted, finds the NoCloud seed, and
# the boot proceeds normally. cloud-init's own ds-identify carries a special
# case for Ubuntu Core for the same underlying reason -- a /var/lib/cloud bind
# mount that "might not be done yet" -- but there is none for ostree.
#
# The cost is a node with no seed at all, which used to skip cloud-init
# outright and now searches every datasource in the list before giving up,
# adding the metadata-service timeouts to its boot. A node with no
# configuration has nothing to do either way, so the trade is worth it.
policy: search,found=all,maybe=all,notfound=enabled
