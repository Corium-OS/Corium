# Corium cloud-init defaults.
#
# This file lives in /etc because that is the only place cloud-init reads from.
# OSTree merges it on upgrade, so local edits survive — but a file the operator
# has modified will no longer track changes shipped in later images.

# Datasources probed at boot, in order. The list is deliberately broad: one image
# should boot unmodified on bare metal, a hypervisor, or any major cloud.
# NoCloud comes first because it is the only fully offline option and the one
# bare-metal and libvirt/Proxmox installs rely on.
datasource_list: [ NoCloud, ConfigDrive, OpenStack, Ec2, Azure, GCE, Hetzner, VMware, OVF, None ]

# Corium does not create a default user. Identity is the operator's decision and
# an unmanaged default account on a Kubernetes node is a liability.
users: []
disable_root: true

# NetworkManager owns the network on this image. cloud-init writes its
# configuration through it rather than laying down a competing renderer, which
# is the usual source of a node that boots with no route to anywhere.
network:
  renderers: [ 'network-manager' ]

# Package installation at first boot does not work on an image-based OS: /usr is
# read-only and the package set is decided at build time. Leaving these enabled
# produces confusing failures late in boot rather than a clear one early.
package_update: false
package_upgrade: false
package_reboot_if_required: false
