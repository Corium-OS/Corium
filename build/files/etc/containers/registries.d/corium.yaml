# Look for sigstore signatures attached to Corium images.
#
# Without this the runtime never looks: it defaults to the older "lookaside"
# mechanism, and a policy requiring a signature fails with
# "A signature was required, but no signature exists" while the signature sits
# in the registry, correctly attached and simply never consulted.
#
# corium-zfs is the signed ZFS variant (deploy/zfs/, published by the image
# workflow). It carries the same requirement in ../policy.json and needs the
# same attachment lookup enabled here, or a node cannot upgrade onto it.
docker:
  ghcr.io/corium-os/corium:
    use-sigstore-attachments: true
  ghcr.io/corium-os/corium-zfs:
    use-sigstore-attachments: true
  # The k0s system extensions, pulled by skopeo rather than bootc but gated by
  # the same policy.json. See docs/adr/0010-kubernetes-version-axis.md.
  ghcr.io/corium-os/k0s:
    use-sigstore-attachments: true

# And the same for anywhere else, because the scope that matters is not known
# at build time: corium.kubernetes.mirror may point at any registry reachable
# from an operator's site, and a mirror changes where an artefact comes from
# rather than whether it has to be signed. Enabling the lookup is not the same
# as requiring a signature -- what is required of one is policy.json's business,
# and a scope it makes no demand about is unaffected by looking.
default-docker:
  use-sigstore-attachments: true

# A note on the matching policy in ../policy.json:
#
# signedIdentity is matchRepository, not matchRepoDigestOrExact. Signing is
# done by digest, so the signature records "ghcr.io/corium-os/corium" with no
# tag. matchRepoDigestOrExact compares against the reference being pulled --
# which has a tag -- and rejects it with "Signature for identity ... is not
# accepted", a message that reads like the key is wrong when it is not.
