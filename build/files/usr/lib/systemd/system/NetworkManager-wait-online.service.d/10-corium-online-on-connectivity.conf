# Make network-online.target mean "this node has connectivity" rather than
# "every carrier-up NIC has finished coming up".
#
# The stock unit runs `nm-online -s -q`. The -s flag waits for NetworkManager's
# *startup* to complete, which NM defines as every profile and device having
# reached a conclusive state -- activated OR disconnected, with no further event
# expected. That is stricter than it sounds on a multi-NIC machine: a second
# physical port with a live carrier but no DHCP server (an OVH vRack port that is
# cabled but not provisioned, a bonded port with no lease, an unplugged-into-a-
# dead-switch NIC) gets an auto-default "Wired connection N" profile that loops
# forever in "getting IP configuration". It never activates and never gives up
# inside the window, so `nm-online -s` never sees startup complete, hits its
# NM_ONLINE_TIMEOUT (60s on Fedora) and exits non-zero. The node is healthy --
# greenboot is green, k0s is Ready -- but NetworkManager-wait-online.service sits
# permanently `failed`, costs ~60s of every boot, and a durably red unit on a
# system whose whole model is "I boot, I am healthy, else I roll back" teaches
# operators to ignore red. That is the real cost, more than the minute.
#
# Dropping -s switches nm-online to its default mode: it returns as soon as
# NetworkManager reaches a connected state, which per the nm-online source means
# NM_STATE_CONNECTED_LOCAL -- at least one connection has an IP address, a
# default route not required. That is exactly what the units gated on this target
# actually need: corium-apid.service needs "an address to bind to", and
# corium-uncordon / the upgrade units need connectivity that is long up by the
# time they run. The dead secondary NIC is simply no longer waited on.
#
# This holds across every kind of Corium node, which is why it is an image
# default and not a per-machine fix:
#   - OVH multi-NIC (the case this was found on): the live port comes up in
#     seconds -> target reached, unit green, ~60s saved; the dead port ignored.
#   - NoCloud / no cloud-init datasource (bare metal, PXE, appliance): the
#     primary NIC is brought up by NM's auto-default DHCP; the target is reached
#     as soon as it gets a lease.
#   - Air-gapped or static-IP node with no default route: CONNECTED_LOCAL is
#     still reached -> green, exactly as -s gave before.
#   - A node with genuinely no network at all: still times out and goes red --
#     correctly, because that node really is broken.
#
# Why not the other levers:
#   - `[main] no-auto-default=*` in NetworkManager.conf would stop the dead port
#     getting a profile, but it also removes the only mechanism that brings the
#     PRIMARY NIC up on a node with no cloud-init datasource (see the datasource
#     list in etc/cloud/cloud.cfg.d/05-corium.cfg, which ends in None on
#     purpose). That would silently strand bare-metal/PXE nodes with no network.
#     Same class of mistake as forcing `network: {renderers}`, which 05-corium.cfg
#     already refuses.
#   - Just lowering NM_ONLINE_TIMEOUT only makes the red unit appear faster; it
#     does not make it green.
#   - Capping ipv4.dhcp-timeout / ipv6.ra-timeout globally does turn it green
#     while keeping -s, but the boot still pays that timeout every time and it
#     lowers the DHCP tolerance of the primary NIC too, since NM defaults cannot
#     target "secondary NICs only" without naming interfaces.
#
# Caveat, in the spirit of the sshd/wireguard-tools notes in ADR 5/6: this
# overrides a distro unit's ExecStart, so it must be re-checked when the
# NetworkManager package is bumped -- if upstream changes the wait-online command
# line, this reset silently drops the change. The stock form is `nm-online -s -q`
# with NM_ONLINE_TIMEOUT set in the unit environment; nm-online reads that env
# var itself, so leaving --timeout off here keeps the operator's documented
# `systemctl edit` / NM_ONLINE_TIMEOUT tuning point working.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q
