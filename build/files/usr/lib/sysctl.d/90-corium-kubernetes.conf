# Kernel settings required by Kubernetes networking.
#
# Shipped in /usr so they are image-owned and restored on every upgrade. An
# operator who needs different values overrides them in /etc/sysctl.d, which
# takes precedence and survives OS updates.

# Pods on other nodes are reached by routing through this host.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Bridged traffic must traverse iptables for kube-proxy and network policy to
# see it. Without this, services silently fail to resolve for bridged pods.
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# A busy node runs far more file watches and network connections than a
# general-purpose server. These defaults are too low for kubelet and containerd.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
net.core.somaxconn = 32768
