# Persistent state directories, created by systemd at boot.
#
# /var belongs to the machine, not to the image: its contents are seeded once at
# install time and never updated afterwards. Creating these directories with
# mkdir during the build would work on a fresh install and silently do nothing
# on an existing machine. tmpfiles.d is the mechanism that works in both cases,
# and it is what bootc's lint asks for.

d /var/lib/k0s    0700 root root -
# 0711, not 0700: sshd opens an authorized-keys file as the user logging in,
# and /var/lib/corium/ssh below is such a file's directory -- so this one has to
# be walked through by an unprivileged process. Traversal is not listing. What
# is under here keeps its own mode, and the one thing that matters, the API's
# state directory with this node's serving key, stays 0700.
d /var/lib/corium 0711 root root -

# Who is allowed to manage this node: the pinned operator CA and the serving
# identity. 0700 because the serving private key lives here; the CA certificate
# inside it is world-readable, as a certificate should be.
d /var/lib/corium/api 0700 root root -

# SSH keys the management API trusts, one file per user. Root-owned, because
# this is the API's to manage and not the user's -- their own ~/.ssh is
# separate and untouched.
#
# 0711 rather than 0700, and the files inside are 0644. sshd reads an
# authorized-keys file as the user who is logging in, so anything that user
# cannot reach is a file sshd skips without saying so: 0700 here produced a node
# that accepted the key, listed it, logged it as trusted, and refused every
# login. StrictModes is the rule that applies, and it refuses a path others can
# *write*, which none of this is. Nothing is given away either -- a public key
# is not a secret, which is why this API hands the list of them to a readonly
# client.
#
# 0711 rather than 0755 because nobody needs to enumerate which users have keys.
#
# The daemon creates this lazily too, so a node that is never given a key never
# grows the directory. See docs/adr/0005-ssh-access-over-the-api.md.
d /var/lib/corium/ssh 0711 root root -

# cloud-init's state directory. The package creates it during the build, which
# puts image content in /var; declaring it here lets systemd own it instead.
d /var/lib/cloud  0755 root root -

# /opt is a symlink to /var/opt on this image, because Kubernetes needs
# /opt/cni/bin to be writable and /opt belongs to the read-only image.
# systemd creates the target and the CNI subdirectory so the plugin DaemonSet
# finds somewhere to install into on a freshly provisioned node.
d /var/opt     0755 root root -
d /var/opt/cni 0755 root root -
d /var/opt/cni/bin 0755 root root -

# The qemu-guest-agent package creates its log directory during the build,
# which puts image content in /var. systemd owns it instead.
d /var/log/qemu-ga 0755 root root -
