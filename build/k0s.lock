# Pinned k0s releases.
#
# The checksums live in git, not alongside the download. A checksum fetched from
# the same place as the artefact protects against corruption, not against a
# compromised release — this file is the trust anchor and changing it is a
# reviewable event.
#
# There is nothing to copy from upstream even if we wanted to: a k0s release
# carries the bare binaries and 345-byte cosign signatures with no bundle or
# certificate beside them. Neither a checksum file nor a verifiable signature is
# published. Read the diff; it is the only control there is.
#
# This file pins two different things, and the distinction is ADR 10's:
#
#   K0S_FLOOR is the version baked into /usr/bin/k0s at image build time. It is
#   what a node runs when it has been told nothing, when it cannot reach a
#   mirror, or when its system extension has stopped matching. Every image has
#   exactly one.
#
#   The table is the supported window: the versions this image will build and
#   accept system extensions for. Three minors, a width taken from k0s's own
#   version skew policy — upgrades go one minor at a time, controllers first,
#   and workers may trail controllers by one, so a cluster mid-rollout
#   legitimately spans two. The third is the one an operator can move to without
#   first taking an OS upgrade they did not ask for.
#
# Refresh the floor or add a version with: mise run k0s-window vX.Y.Z+k0s.N

K0S_FLOOR=v1.36.4+k0s.0

