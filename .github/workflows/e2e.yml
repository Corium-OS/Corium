# End-to-end: boot a real node and drive it with cctl.
#
# Every one of this project's worst bugs passed review and unit tests and only
# appeared on a running machine -- a systemd ordering cycle that deleted the
# bootstrap job, every node registering as "fedora", an HA controller claiming
# the virtual IP as its own, an SSH key the API accepted and sshd silently
# refused. This is the cheapest imitation of a running machine that CI can hold.
#
# It is off by default and runs only when a pull request carries the `e2e`
# label, because it builds an image and a disk and then boots them: half an hour
# or so, against two minutes for the rest of CI. The Kubernetes version change
# at the end adds to that -- it pulls a quarter of a gigabyte onto the node and
# then drains it -- and is worth the minutes: swapping the binary underneath a
# running k0s is the one path whose failure modes only exist on a real machine.
name: End-to-end

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Boot a node and drive it with cctl
    # `labeled` alone would not re-run on a later push, and `synchronize` alone
    # would not run when the label is first applied. Asking the payload whether
    # the label is on the pull request right now covers both.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    # osbuild cannot mount its container storage on ubuntu-26.04; see image.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/corium-disk

      - name: Boot it
        run: |
          cp "${OVMF_VARS}" vars.fd

          # User-mode networking, so no bridge and no privileges. cctl pins the
          # node by the fingerprint of the certificate it serves rather than by
          # hostname, which is exactly what makes reaching it on 127.0.0.1
          # through a forwarded port legitimate instead of a fudge.
          qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -smp 4 -m 4096 \
            -drive "if=pflash,format=raw,readonly=on,file=${OVMF_CODE}" \
            -drive "if=pflash,format=raw,file=vars.fd" \
            -drive "file=output/qcow2/disk.qcow2,if=virtio,format=qcow2" \
            -drive "file=seed.iso,if=virtio,format=raw,readonly=on" \
            -netdev "user,id=net0,hostfwd=tcp::7443-:7443,hostfwd=tcp::2222-:22,hostfwd=tcp::6443-:6443" \
            -device virtio-net-pci,netdev=net0 \
            -display none -serial file:console.log -daemonize

      - name: Wait for the node to offer itself
        run: |
          # The banner on the console is the signal, not the open port: the
          # daemon binds before it has minted an identity, and the pairing code
          # is what the test needs next.
          for attempt in $(seq 1 120); do
            if grep -q "pairing code" console.log 2>/dev/null; then
              echo "the node is up and waiting to be claimed"
              grep -A6 "unenrolled" console.log | tail -8
              exit 0
            fi
            sleep 5
          done

          echo "::error::the node never printed a pairing code" >&2
          tail -60 console.log || true
          exit 1

      - name: Check kubectl is here to ask Kubernetes with
        run: |
          # The runner image ships it. If that ever stops being true this says
          # so, rather than the Ready check quietly never running.
          command -v kubectl >/dev/null || {
            echo "::error::kubectl is not on this runner; the Ready check needs it" >&2
            exit 1
          }
          kubectl version --client

      - name: Drive it with cctl
        env:
          ADDRESS: 127.0.0.1:7443
          K8S_SERVER: 127.0.0.1:6443
          CCTL: ${{ github.workspace }}/bin/cctl
          CONSOLE: ${{ github.workspace }}/console.log
          SSH_PORT: "2222"
        run: .github/e2e/drive-a-node.sh

      - name: What the node said, whatever happened
        if: always()
        run: |
          echo "::group::console"
          tail -200 console.log || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-console
          path: console.log
          retention-days: 7

  rollout:
    name: Roll a two-node cluster and forget the worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    # Same pin as the node job, for the same osbuild reason.
    runs-on: ubuntu-24.04
    # Two nodes, four extension pulls and three rollouts on top of the build.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/corium-disk

      - name: A private network for the two nodes
        run: |
          # User-mode networking gives every VM the same address, which k0s
          # would advertise. A bridge with NAT gives each its own, reachable
          # from here and from the other. Docker's FORWARD DROP policy is why
          # the forward rules are needed.
          sudo ip link add br0 type bridge
          sudo ip addr add 10.0.0.1/24 dev br0
          sudo ip link set br0 up
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -t nat -A POSTROUTING -s 10.0.0.0/24 ! -o br0 -j MASQUERADE
          sudo iptables -I FORWARD -i br0 -j ACCEPT
          sudo iptables -I FORWARD -o br0 -j ACCEPT
          sudo dnsmasq --interface=br0 --bind-interfaces --except-interface=lo \
            --dhcp-range=10.0.0.100,10.0.0.200,12h \
            --dhcp-host=52:54:00:00:00:10,10.0.0.10 \
            --dhcp-host=52:54:00:00:00:11,10.0.0.11 \
            --log-facility="${PWD}/dnsmasq.log"
          sudo mkdir -p /etc/qemu
          echo "allow br0" | sudo tee /etc/qemu/bridge.conf

      - name: Boot them
        run: |
          for vm in ctrl:10 worker:11; do
            name="${vm%:*}" mac="52:54:00:00:00:${vm#*:}"
            qemu-img create -q -f qcow2 -F qcow2 -b "${PWD}/output/qcow2/disk.qcow2" "${name}.qcow2" 20G
            cp "${OVMF_VARS}" "${name}-vars.fd"
            cp seed.iso "${name}-seed.iso"
            sudo qemu-system-x86_64 \
              -machine q35,accel=kvm -cpu host -smp 2 -m 4096 \
              -drive "if=pflash,format=raw,readonly=on,file=${OVMF_CODE}" \
              -drive "if=pflash,format=raw,file=${name}-vars.fd" \
              -drive "file=${name}.qcow2,if=virtio,format=qcow2" \
              -drive "file=${name}-seed.iso,if=virtio,format=raw,readonly=on" \
              -netdev bridge,id=net0,br=br0 \
              -device "virtio-net-pci,netdev=net0,mac=${mac}" \
              -display none -serial "file:${name}.log" -daemonize
          done

      - name: Wait for both nodes to offer themselves
        run: |
          for name in ctrl worker; do
            for attempt in $(seq 1 120); do
              if sudo grep -q "pairing code" "${name}.log" 2>/dev/null; then
                echo "${name} is waiting to be claimed"
                continue 2
              fi
              sleep 5
            done
            echo "::error::${name} never printed a pairing code" >&2
            sudo tail -60 "${name}.log" || true
            exit 1
          done
          sudo chmod a+r ctrl.log worker.log

      - name: Drive the rollouts with cctl
        env:
          CTRL: 10.0.0.10:7443
          WORKER: 10.0.0.11:7443
          CCTL: ${{ github.workspace }}/bin/cctl
          CTRL_CONSOLE: ${{ github.workspace }}/ctrl.log
          WORKER_CONSOLE: ${{ github.workspace }}/worker.log
        run: .github/e2e/drive-a-rollout.sh

      - name: What the nodes said, whatever happened
        if: always()
        run: |
          for name in ctrl worker; do
            echo "::group::${name} console"
            sudo tail -200 "${name}.log" || true
            echo "::endgroup::"
          done
          echo "::group::dnsmasq"
          sudo cat dnsmasq.log || true
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-consoles
          path: |
            ctrl.log
            worker.log
          retention-days: 7
