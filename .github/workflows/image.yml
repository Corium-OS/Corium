# Build the OS image, and publish it from main and tags.
name: Image

on:
  pull_request:
    paths:
      - Containerfile
      - build/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/image.yml
  push:
    branches: [main]
    tags: ["v*"]
  # Base images get security updates that this image should pick up even when
  # nothing here changes.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: corium-os/corium

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.plan.outputs.version }}

    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this token for a short-lived
      # certificate, so there is no private key to store or rotate.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Work out whether this build gets published
        id: plan
        run: |
          # Pull requests build but never publish: a PR from a fork must not be
          # able to push an image that nodes would later pull.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

          # The git tag is v0.1.0; the version is 0.1.0. Stripping the prefix
          # once, here, is what keeps the image tag, the
          # org.opencontainers.image.version label and `corium-agent version`
          # all saying the same thing.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build
        id: build
        run: |
          # Retried because pulling the base image fails transiently often
          # enough to matter -- a 502 from the registry is not a broken commit,
          # and a red build for that reason erodes trust in the signal.
          #
          # bootc container lint runs inside the build with --fatal-warnings,
          # so a genuine warning still fails this step rather than scrolling
          # past; the retry does not hide it, since a lint failure is
          # deterministic and fails every attempt.
          for attempt in 1 2 3; do
            if podman build \
              --build-arg VERSION="${{ steps.plan.outputs.version }}" \
              --build-arg COMMIT="${GITHUB_SHA::7}" \
              --tag "localhost/corium:ci" \
              --file Containerfile .
            then
              exit 0
            fi

            echo "build attempt ${attempt} failed" >&2
            [ "${attempt}" = "3" ] && exit 1
            sleep $((attempt * 20))
          done

      - name: Inspect what was produced
        run: |
          podman run --rm localhost/corium:ci k0s version
          podman run --rm localhost/corium:ci corium-agent version
          # The image must declare a root filesystem, or nothing can install it.
          podman run --rm localhost/corium:ci \
            bootc install print-configuration | grep -q '"root-fs-type"'
          echo "image size: $(podman images --format '{{.Size}}' localhost/corium:ci)"

      - name: Verify the pinned k0s version matches the lock file
        run: |
          # shellcheck disable=SC1091
          . build/k0s.lock
          actual="$(podman run --rm localhost/corium:ci k0s version)"
          if [ "${actual}" != "${K0S_VERSION}" ]; then
            echo "image ships k0s ${actual} but build/k0s.lock pins ${K0S_VERSION}" >&2
            exit 1
          fi
          echo "k0s ${actual} matches the lock file"

      - name: Log in to the registry
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: steps.plan.outputs.publish == 'true'
        id: push
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          version="${{ steps.plan.outputs.version }}"
          tags="${version}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A release publishes a ladder of tags, so a node can choose how
            # much movement it accepts:
            #
            #   1.4.2   never moves      -- pin to an exact release
            #   1.4     follows patches  -- fixes within that minor
            #   1       follows minors   -- new features, no breaking changes
            #   latest  follows releases -- whatever is newest
            #
            # There is no `0` rung, and below 1.0 the ladder is 0.1.0, 0.1 and
            # latest. Semantic versioning reserves 0.y.z for initial
            # development and lets a minor bump break, so a `0` tag meaning
            # "new features, no breaking changes" would promise exactly what
            # the version scheme withholds. `0.1` survives the same test,
            # because a patch bump does not break even in 0.x, and so does
            # `latest`, which claims recency and never compatibility.
            #
            # Prereleases (1.4.0-rc.1) publish only their exact tag: a release
            # candidate must never be picked up by a node following 1.4.
            #
            # The grammar below is semver's own rather than [0-9]+, which
            # accepts leading zeros: v01.2.3 would yield major="01", which is
            # not "0", and publish a nonsense `01` rung.
            if [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"

              tags="${version} ${major}.${minor}"
              if [ "${major}" != "0" ]; then
                tags="${tags} ${major}"
              fi
              tags="${tags} latest"
            else
              echo "::notice::${version} is a prerelease or not a stable semantic version; publishing that tag only"
            fi
          elif [ "${{ github.ref_name }}" = "main" ]; then
            tags="${tags} main"
          fi

          digest=""
          for tag in ${tags}; do
            # An OCI tag is [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}. Semver build
            # metadata (1.4.2+build) contains a '+' and cannot be one at all,
            # so say that here rather than letting podman die on a reference
            # parse error after we have already logged in to the registry.
            if [[ ! "${tag}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$ ]]; then
              echo "::error::${tag} is not a valid OCI tag" >&2
              exit 1
            fi

            podman tag localhost/corium:ci "${image}:${tag}"
            # --digestfile records the digest of the manifest as the registry
            # stored it. The local RepoDigests value is not the same thing:
            # podman can rewrite the manifest on push, and signing the local
            # digest then fails with a 404 against a manifest that never
            # existed upstream.
            podman push --digestfile /tmp/digest "${image}:${tag}"
            pushed="$(cat /tmp/digest)"
            echo "pushed ${image}:${tag} (${pushed})"

            # Every tag in this loop is the same manifest, so every push must
            # report the same digest. Only one of them is signed. If they ever
            # disagreed, the signature would cover an image nobody pulled --
            # so check the invariant rather than assuming it.
            if [ -z "${digest}" ]; then
              digest="${pushed}"
            elif [ "${pushed}" != "${digest}" ]; then
              echo "::error::${tag} pushed ${pushed}, but ${digest} was expected" >&2
              exit 1
            fi
          done

          # Sign by digest, not by tag: tags move, digests do not, and a
          # signature attached to a tag says nothing about what it points at now.
          echo "digest=${image}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        if: steps.plan.outputs.publish == 'true'
        # Pinned to an exact version rather than a floating major tag. This
        # action is what signs the images nodes will trust, so it gets a
        # narrower pin than the rest -- and cosign-installer publishes no v4
        # tag anyway, only full versions.
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # cosign v2, not the v3 default.
          #
          # v3 always attaches signatures as OCI referrers. containers-policy
          # -- what a node consults to enforce a signature -- only looks for
          # the <digest>.sig tag, and v3 offers no way to write it:
          # --registry-referrers-mode controls fetching, not publishing. v2
          # writes the layout enforcement can actually find.
          cosign-release: v2.6.5

      - name: Sign the image
        if: steps.plan.outputs.publish == 'true'
        run: |
          digest="${{ steps.push.outputs.digest }}"

          # Signed twice, because the two signatures answer different questions.
          #
          # Keyless proves which workflow run produced this image, and is
          # recorded in a public transparency log. It is what a human checks.
          # But a node cannot enforce it: containers-policy.json matches the
          # signer by subjectEmail, and a GitHub Actions certificate carries a
          # URI instead -- enforcement fails with `Required email ... not found
          # (got [])`. Verified on a node.
          #
          # The key signature is what nodes can actually require, because a
          # policy can name a public key with no identity matching involved.
          cosign sign --yes "${digest}"
          echo "signed (keyless) ${digest}"

          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${digest}"
          echo "signed (key) ${digest}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.plan.outputs.version }}\` |"
            echo "| Published | ${{ steps.plan.outputs.publish }} |"
            if [ "${{ steps.plan.outputs.publish }}" = "true" ]; then
              echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  artefacts:
    name: Build and publish the installable artefacts
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      iso_reference: ${{ steps.publish.outputs.iso_reference }}
      iso_digest: ${{ steps.publish.outputs.iso_digest }}
      iso_blob: ${{ steps.publish.outputs.iso_blob }}
      iso_name: ${{ steps.publish.outputs.iso_name }}
      iso_mirror: ${{ steps.mirror.outputs.iso_url }}
      qcow2_reference: ${{ steps.publish.outputs.qcow2_reference }}
      qcow2_digest: ${{ steps.publish.outputs.qcow2_digest }}
      qcow2_blob: ${{ steps.publish.outputs.qcow2_blob }}
      qcow2_name: ${{ steps.publish.outputs.qcow2_name }}
      qcow2_mirror: ${{ steps.mirror.outputs.qcow2_url }}

    env:
      # Separate repositories, not tags on the image. containers-policy scopes
      # match on whole path components, so these sit outside the policy a node
      # enforces for ghcr.io/corium-os/corium -- an installer is downloaded by
      # a person, never pulled by a node, and mixing the two in one repository
      # would put things that cannot boot in the tag list of the thing that
      # does.
      ISO_IMAGE: ghcr.io/corium-os/corium-iso
      QCOW2_IMAGE: ghcr.io/corium-os/corium-qcow2
      # A plain HTTPS download, for people who would rather click a link than
      # install a tool.
      #
      # Two hosts, not one: artefacts are written to a bunny.net storage zone
      # and read from the CDN pull zone in front of it. Writing to one and
      # advertising the other is the whole point -- the storage endpoint is
      # not meant to serve public traffic.
      #
      # Nothing is ever overwritten, which matters more here than it looks.
      # The CDN does not watch its origin for changes: a replaced file keeps
      # being served from cache until it expires, and purging needs an
      # account-wide API key this workflow deliberately does not hold. Every
      # name carries its version, so the question never arises.
      MIRROR_ENDPOINT: https://${{ vars.BUNNY_REGION }}-s3.storage.bunnycdn.com
      MIRROR_BUCKET: ${{ secrets.BUNNY_STORAGE_ZONE }}
      MIRROR_BASE_URL: ${{ vars.BUNNY_PULL_ZONE_URL }}

    steps:
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the artefacts from the published image
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          # Measured, because the numbers in circulation are wrong: GitHub
          # documents 14 GB of runner storage and the figure people repeat is
          # 25-30 GB free. A real run had 145 GB with 87 GB free, against a
          # 2.4 GB image and a 2.4 GB ISO. There was a step here that deleted
          # the Android SDK and the tool cache to make room; it took 85
          # seconds and freed space nothing needed.
          df -h /

          # By digest, not by tag: these install the exact bytes that were
          # signed a job ago, and nothing that moves in between.
          #
          # Pulling first is what bootc-image-builder expects -- using local
          # storage is its default now, and it tells you to run this exact
          # command if it cannot find the image.
          sudo podman pull "${IMAGE_DIGEST}"

          mkdir -p output
          # One run per artefact. --type does take more than one value, but
          # bootc-image-builder counts ISOs and disks separately and refuses a
          # request containing both: "cannot mix ISO/disk images in request".
          # qcow2 and raw together would be fine; an ISO with either is not.
          #
          # The cost is small. The image above is pulled once and both runs
          # read it out of the same local storage.
          for type in anaconda-iso qcow2; do
            echo "::group::building ${type}"
            sudo podman run --rm --privileged \
              --security-opt label=type:unconfined_t \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              -v "${PWD}/output:/output" \
              quay.io/centos-bootc/bootc-image-builder:latest \
              --type "${type}" \
              "${IMAGE_DIGEST}"
            echo "::endgroup::"
          done

          # bootc-image-builder floats on :latest, here as in the Makefile, so
          # these are verifiable but not reproducible. Record which builder
          # produced them, since that is the part we can still be honest about.
          sudo podman image inspect --format '{{index .RepoDigests 0}}' \
            quay.io/centos-bootc/bootc-image-builder:latest

          sudo chown -R "$(id -u):$(id -g)" output
          find output -type f -printf '%s\t%p\n'

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # cosign v2, for the same reason the image uses it: v3 writes
          # signatures as OCI referrers, and GHCR does not implement the
          # referrers API at all.
          cosign-release: v2.6.5

      - name: Install oras
        uses: oras-project/setup-oras@v2.0.1
        with:
          # The newest release this action knows about. It carries a table of
          # versions and their checksums, so the CLI version is capped by the
          # action's own release date, not by what ORAS has published: asking
          # for 1.3.4 fails with "official ORAS CLI releases does not contain
          # version 1.3.4" rather than downloading it.
          version: 1.3.3

      - name: Publish and sign them
        id: publish
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          version="${{ needs.build.outputs.version }}"

          # $1 key  $2 file bootc-image-builder wrote  $3 published file name
          # $4 repository  $5 artifact type  $6 layer media type
          publish() {
            key="$1"; built="$2"; name="$3"; repo="$4"; artifact="$5"; media="$6"

            # oras records the file name in org.opencontainers.image.title,
            # and that is what `oras pull` writes to disk. Name it before
            # pushing, or everyone ends up with install.iso and disk.qcow2.
            mv "${built}" "${name}"
            blob="sha256:$(sha256sum "${name}" | cut -d' ' -f1)"
            echo "${name} is $(du -h "${name}" | cut -f1), ${blob}"

            oras push --artifact-type "${artifact}" \
              "${repo}:${version}" "${name}:${media}"

            # Resolved rather than parsed out of the push output: this is the
            # descriptor the registry stored, which is what gets signed.
            digest="$(oras manifest fetch --descriptor "${repo}:${version}" | jq -r .digest)"
            reference="${repo}@${digest}"

            # Signed exactly like the image. cosign signs whatever is in a
            # registry; an artifact manifest is no different from an image one.
            cosign sign --yes "${reference}"
            echo "signed (keyless) ${reference}"

            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${reference}"
            echo "signed (key) ${reference}"

            {
              echo "${key}_reference=${repo}:${version}"
              echo "${key}_digest=${reference}"
              echo "${key}_blob=${blob}"
              echo "${key}_name=${name}"
            } >> "${GITHUB_OUTPUT}"
          }

          publish iso output/bootiso/install.iso \
            "corium-${version}-x86_64.iso" "${ISO_IMAGE}" \
            application/vnd.corium.installer.iso application/x-iso9660-image

          publish qcow2 output/qcow2/disk.qcow2 \
            "corium-${version}-x86_64.qcow2" "${QCOW2_IMAGE}" \
            application/vnd.corium.disk.qcow2 application/x-qemu-disk

      - name: Mirror them to plain HTTPS URLs
        id: mirror
        # The signed artifacts above are the release. These are convenience
        # copies on self-hosted storage, so they must never be able to take a
        # release down with them: the step is allowed to fail, and the notes
        # mention a mirror only when there is one to mention.
        continue-on-error: true
        env:
          # bunny.net uses the storage zone name as the access key and its
          # password as the secret. One credential, scoped to that zone, with
          # no reach into the rest of the account.
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: ${{ vars.BUNNY_REGION }}
          ISO_NAME: ${{ steps.publish.outputs.iso_name }}
          QCOW2_NAME: ${{ steps.publish.outputs.qcow2_name }}
        run: |
          # One failing upload must not suppress the other's URL, so each is
          # advertised on its own merits.
          failed=0
          for pair in "iso:${ISO_NAME}" "qcow2:${QCOW2_NAME}"; do
            key="${pair%%:*}"; name="${pair#*:}"

            if ! aws --endpoint-url "${MIRROR_ENDPOINT}" \
              s3 cp "${name}" "s3://${MIRROR_BUCKET}/${name}" --only-show-errors
            then
              echo "::warning::${name} did not upload; not advertising it"
              failed=1
              continue
            fi

            # What was written is not what is read: the URL is the CDN's.
            url="${MIRROR_BASE_URL}/${name}"

            # Ask for a byte as a stranger would rather than trust that the
            # upload made it public. An advertised URL that 403s is worse than
            # no link at all, and the first request also warms the edge.
            #
            # Retried because this is the CDN's first sight of the object and
            # it has to reach back to storage for it.
            code=000
            for attempt in 1 2 3 4 5; do
              code="$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 "${url}")"
              case "${code}" in 200|206) break ;; esac
              echo "attempt ${attempt}: ${url} answered ${code}"
              sleep $((attempt * 5))
            done

            if [ "${code}" != "206" ] && [ "${code}" != "200" ]; then
              echo "::warning::${url} answered ${code}; not advertising it"
              failed=1
              continue
            fi

            echo "${key}_url=${url}" >> "${GITHUB_OUTPUT}"
            echo "mirrored to ${url}"
          done
          exit "${failed}"

  release:
    name: Publish the GitHub Release
    needs: [build, artefacts]
    # Only a real tag push. workflow_dispatch can be pointed at a tag too, and
    # rebuilding a published image by hand must not try to create its Release a
    # second time.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      # The only job that writes to the repository, so the grant stays here
      # rather than at the top of the file where it would widen the build too.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Passed through the environment rather than interpolated into the
          # script: a tag name is chosen by whoever pushed it.
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.build.outputs.digest }}
          ISO_REFERENCE: ${{ needs.artefacts.outputs.iso_reference }}
          ISO_DIGEST: ${{ needs.artefacts.outputs.iso_digest }}
          ISO_BLOB: ${{ needs.artefacts.outputs.iso_blob }}
          ISO_NAME: ${{ needs.artefacts.outputs.iso_name }}
          ISO_MIRROR: ${{ needs.artefacts.outputs.iso_mirror }}
          QCOW2_REFERENCE: ${{ needs.artefacts.outputs.qcow2_reference }}
          QCOW2_DIGEST: ${{ needs.artefacts.outputs.qcow2_digest }}
          QCOW2_BLOB: ${{ needs.artefacts.outputs.qcow2_blob }}
          QCOW2_NAME: ${{ needs.artefacts.outputs.qcow2_name }}
          QCOW2_MIRROR: ${{ needs.artefacts.outputs.qcow2_mirror }}
        run: |
          # Re-running a tag build after a transient registry failure replays
          # the same push event. Publishing the image again is harmless;
          # creating the Release again is not.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} already has a Release; leaving it alone"
            exit 0
          fi

          if [ -z "${DIGEST}" ]; then
            echo "::error::the build published no digest" >&2
            exit 1
          fi

          if [ -z "${ISO_DIGEST}" ] || [ -z "${QCOW2_DIGEST}" ]; then
            echo "::error::the artefacts job published nothing" >&2
            exit 1
          fi

          version="${TAG#v}"

          # Keep a Changelog sections look like "## [0.1.0] - 2026-09-16" and
          # run to the next "## " heading, the link reference definitions at
          # the foot of the file, or the end of it. Matched with index()
          # rather than a regex: a version number is mostly dots, and every
          # one of them is a wildcard to a regex engine. "### Added" does not
          # end a section, because in it "## " starts at column two.
          #
          # The link definitions matter because the oldest section is last, so
          # without that rule it swallows them. They render as nothing, which
          # is exactly why the mistake would have gone unnoticed.
          section() {
            awk -v head="## [$1]" '
              index($0, head) == 1 { inside = 1; next }
              inside && index($0, "## ") == 1 { exit }
              inside && /^\[[^]]+\]: / { exit }
              inside { print }
            ' CHANGELOG.md
          }

          prerelease=false
          case "${TAG}" in *-*) prerelease=true ;; esac

          # Not [ -z ], which would accept a section containing one blank line
          # and publish a Release with an empty body.
          notes="$(section "${version}")"
          if ! printf '%s' "${notes}" | grep -q '[^[:space:]]'; then
            if [ "${prerelease}" = true ]; then
              # A release candidate is cut before its own section is written.
              echo "::notice::no CHANGELOG section for ${version}; using Unreleased"
              notes="$(section "Unreleased")"
            else
              echo "::error::CHANGELOG.md has no section for ${version}" >&2
              exit 1
            fi
          fi

          # printf rather than a heredoc: the body is full of fenced code
          # blocks, and backticks in an unquoted heredoc are command
          # substitution, while a quoted one would stop ${DIGEST} expanding.
          {
            printf '%s\n\n' "${notes}"

            printf -- '---\n\n'
            printf '## Getting it\n\n'
            printf 'The signed image is the release. Disk images are a local rendering of it.\n\n'
            printf '```bash\n'
            printf 'podman pull %s\n' "${DIGEST}"
            printf '```\n\n'

            printf '### Check it before you run it\n\n'
            printf 'Keyless first: it needs no key you have to obtain from somewhere.\n\n'
            printf '```bash\n'
            printf 'cosign verify %s \\\n' "${DIGEST}"
            printf '  --certificate-identity-regexp %s \\\n' "'https://github.com/${GH_REPO}/.*'"
            printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n'
            printf '```\n\n'
            printf 'Nodes enforce a second, key-based signature instead, because a container\n'
            printf 'policy cannot match a GitHub Actions identity. To check that one before you\n'
            printf 'have a node, take the public key from this tag rather than from a file\n'
            printf 'attached here: a key arriving by the same channel as the release it\n'
            printf 'authenticates adds nothing.\n\n'
            printf '```bash\n'
            printf 'curl -fsSL -o cosign.pub \\\n'
            printf '  https://raw.githubusercontent.com/%s/%s/build/files/usr/share/corium/cosign.pub\n' "${GH_REPO}" "${TAG}"
            printf 'cosign verify --key cosign.pub %s\n' "${DIGEST}"
            printf '```\n\n'

            printf '### Downloads\n\n'
            printf 'Nothing is attached to this release: the ISO alone is past the 2 GiB\n'
            printf 'limit for a release asset. Both are published as signed OCI artifacts in\n'
            printf 'the same registry, under the same signing chain as the image.\n\n'

            # One block per artefact, because the routes and the checks are
            # identical and only the coordinates differ.
            #   $1 heading  $2 what it is for  $3 repo:tag  $4 repo@digest
            #   $5 blob digest  $6 file name  $7 mirror URL, possibly empty
            artefact() {
              printf '#### %s\n\n%s\n\n' "$1" "$2"
              printf '```bash\n'
              printf 'oras pull %s\n' "$3"
              printf '```\n\n'
              printf 'Without oras:\n\n'
              printf '```bash\n'
              repo="${3#ghcr.io/}"; repo="${repo%%:*}"
              printf 'token=$(curl -s "https://ghcr.io/token?scope=repository:%s:pull" | jq -r .token)\n' "${repo}"
              printf 'curl -L -H "Authorization: Bearer ${token}" -o %s \\\n' "$6"
              printf '  https://ghcr.io/v2/%s/blobs/%s\n' "${repo}" "$5"
              printf '```\n\n'
              if [ -n "$7" ]; then
                printf 'Or from a browser:\n\n%s\n\n' "$7"
              fi
              printf '```bash\n'
              printf 'cosign verify %s \\\n' "$4"
              printf '  --certificate-identity-regexp %s \\\n' "'https://github.com/${GH_REPO}/.*'"
              printf '  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n\n'
              printf 'sha256sum %s\n' "$6"
              printf '#   -> %s\n' "${5#sha256:}"
              printf '```\n\n'
            }

            artefact 'Installer ISO' \
              'Bare metal, interactive or kickstarted. Installs unattended.' \
              "${ISO_REFERENCE}" "${ISO_DIGEST}" "${ISO_BLOB}" "${ISO_NAME}" "${ISO_MIRROR}"

            artefact 'qcow2 disk image' \
              'Proxmox, KVM and libvirt. This is what the scripts under `deploy/proxmox/` expect.' \
              "${QCOW2_REFERENCE}" "${QCOW2_DIGEST}" "${QCOW2_BLOB}" "${QCOW2_NAME}" "${QCOW2_MIRROR}"

            printf 'Every route gives the same bytes. There is no separate checksum file to\n'
            printf 'take on trust: those hashes are the ones cosign signed, by way of each\n'
            printf 'manifest. A mirror, where offered, is a convenience on self-hosted\n'
            printf 'storage -- the registry is the release.\n\n'
            printf 'A raw disk image is not published. `make artefacts IMAGE_TAG=%s` builds\n' "${version}"
            printf 'all three locally, on a Linux host with sudo.\n\n'

            printf -- '---\n\n'
            printf 'New here: [quick start](https://github.com/%s/blob/%s/docs/quickstart.md).\n' "${GH_REPO}" "${TAG}"
            printf 'Upgrading: [which tag to follow](https://github.com/%s/blob/%s/docs/upgrades.md#choosing-what-to-track).\n' "${GH_REPO}" "${TAG}"
          } > "${RUNNER_TEMP}/notes.md"

          # --verify-tag because without it a wrong TAG does not fail: gh
          # creates a tag of that name pointing at the default branch.
          gh release create "${TAG}" \
            --title "Corium ${version}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag \
            --prerelease="${prerelease}"
