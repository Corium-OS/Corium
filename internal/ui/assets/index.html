<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corium</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- The mark, as geometry rather than a picture. Three faces in the three
     tones the logo uses, and the hole is a second subpath with evenodd so it
     is genuinely transparent rather than filled with a guess at the
     background -- which matters here, where the background follows the
     operating system's light and dark setting. -->
<svg class="sprite" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32">
    <path fill="#00897b" fill-rule="evenodd"
          d="M16 2.56 29.02 10 16 17.44 2.98 10Z M16 6.4 20.9 10 16 13.6 11.1 10Z"/>
    <path fill="#7fc4bd" d="M2.49 10.7 15.51 18.14 15.51 29.3 2.49 21.86Z"/>
    <path fill="#38a398" d="M29.51 10.7 16.49 18.14 16.49 29.3 29.51 21.86Z"/>
  </symbol>
</svg>

<header>
  <a class="brand" href="/">
    <svg class="logo" width="28" height="28" aria-hidden="true"><use href="#mark"/></svg>
    <span>Corium</span>
  </a>

  <div class="bar">
    <span id="refreshed" class="muted"></span>
    <label class="toggle"><input type="checkbox" id="auto" checked> auto</label>
    <button id="reload" type="button" class="btn">Reload</button>
  </div>
</header>

<div class="dots"></div>

<main>
  <section id="overview">
    <div class="lead">
      <h2>Your nodes</h2>
      <div id="facts" class="facts"></div>
    </div>

    <div id="nodes" class="grid"></div>
  </section>

  <section id="detail" hidden>
    <div class="lead">
      <button id="back" type="button" class="btn ghost">&larr; All nodes</button>
      <h2 id="detail-title" class="mono"></h2>
      <span id="detail-role" class="fact"></span>
    </div>

    <div id="detail-error" class="notice bad" hidden></div>

    <div class="panels">
      <article>
        <h3>Node</h3>
        <dl id="detail-fields" class="fields"></dl>
      </article>

      <article>
        <h3>Services</h3>
        <table id="services"><tbody></tbody></table>
      </article>

      <article>
        <h3>Lifecycle</h3>
        <p class="muted">Cordon and drain work on controllers only. A drain a
        pod disruption budget refuses is not forced; the node stays cordoned.</p>
        <div class="actions">
          <button data-act="cordon" type="button" class="btn">Cordon</button>
          <button data-act="uncordon" type="button" class="btn">Uncordon</button>
          <button data-act="drain" type="button" class="btn danger">Drain</button>
        </div>
        <p id="action-result" class="muted result"></p>
      </article>
    </div>

    <article class="wide">
      <h3>Journal</h3>
      <div class="bar">
        <select id="log-unit"><option value="">every unit</option></select>
        <select id="log-since">
          <option value="15m">15m</option>
          <option value="1h" selected>1h</option>
          <option value="24h">24h</option>
          <option value="">everything</option>
        </select>
        <button id="log-load" type="button" class="btn solid">Read</button>
      </div>
      <pre id="logs" class="logs"></pre>
    </article>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
